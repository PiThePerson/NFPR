  <meta name="description" content="Connect with NeuronFRAMES across our social channels — Facebook, LinkedIn, and Instagram." />
  <link rel="canonical" href="https://neuronframes.com/linktree" />
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="NeuronFRAMES" />
  <meta property="og:title" content="Connect | NeuronFRAMES" />
  <meta property="og:description" content="Connect with NeuronFRAMES across our social channels." />
  <meta property="og:url" content="https://neuronframes.com/linktree" />

  <meta name="twitter:card" content="summary" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <style>
    /* ─── Linktree page ─────────────────────────────────────────── */
    .lt-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 1.25rem;
      position: relative;
    }
    .lt-card {
      width: 100%;
      max-width: 480px;
      background: color-mix(in oklch, var(--surface) 92%, transparent);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--border);
      border-radius: 28px;
      box-shadow: var(--shadow);
      padding: 2.6rem 2rem 2.2rem;
      text-align: center;
      animation: ltIn .9s cubic-bezier(.22,.61,.36,1) both;
    }
    @keyframes ltIn {
      from { opacity: 0; transform: translateY(26px) scale(.98); }
      to   { opacity: 1; transform: none; }
    }

    /* Top: go to main site */
    .lt-home {
      display: inline-flex;
      align-items: center;
      gap: .55rem;
      font-size: .82rem;
      font-weight: 600;
      letter-spacing: .01em;
      color: var(--accent);
      padding: .55rem 1.1rem;
      border-radius: 999px;
      border: 1px solid color-mix(in oklch, var(--accent) 35%, transparent);
      background: color-mix(in oklch, var(--accent) 8%, transparent);
      transition: transform .25s ease, box-shadow .25s ease, background .25s ease;
      margin-bottom: 2rem;
    }
    .lt-home:hover {
      transform: translateY(-2px);
      background: color-mix(in oklch, var(--accent) 14%, transparent);
      box-shadow: 0 10px 26px -10px rgba(10,95,255,.4);
    }
    .lt-home svg { width: 15px; height: 15px; }

    /* Brand */
    .lt-logo {
      height: 54px;
      width: auto;
      margin: 0 auto .9rem;
      display: block;
    }
    .lt-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      color: var(--text-heading);
      margin: 0;
    }
    .lt-sub {
      font-size: .95rem;
      color: var(--muted);
      margin: .5rem 0 2rem;
      line-height: 1.5;
    }

    /* Social icon row */
    .lt-socials {
      display: flex;
      justify-content: center;
      gap: 1.1rem;
      margin-bottom: 2.2rem;
    }
    .lt-social {
      position: relative;
      width: 62px;
      height: 62px;
      border-radius: 18px;
      display: grid;
      place-items: center;
      color: #fff;
      box-shadow: 0 10px 24px -10px rgba(13,38,76,.45);
      transition: transform .3s cubic-bezier(.22,.61,.36,1), box-shadow .3s ease, filter .3s ease;
    }
    .lt-social svg { width: 28px; height: 28px; }
    .lt-social:hover {
      transform: translateY(-6px) scale(1.06);
      box-shadow: 0 18px 36px -12px rgba(13,38,76,.55);
      filter: saturate(1.1);
    }
    .lt-social:active { transform: translateY(-2px) scale(1.02); }
    .lt-social.facebook  { background: linear-gradient(135deg, #1877f2, #0a5fd6); }
    .lt-social.linkedin  { background: linear-gradient(135deg, #0a66c2, #064a8f); }
    .lt-social.instagram { background: linear-gradient(135deg, #feda75, #fa7e1e 28%, #d62976 58%, #962fbf 80%, #4f5bd5); }

    .lt-divider {
      height: 1px;
      background: linear-gradient(90deg, transparent, var(--border) 25%, var(--border) 75%, transparent);
      margin: 0 0 1.6rem;
    }

    /* Bottom: contact CTA */
    .lt-contact {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: .6rem;
      width: 100%;
      font-size: 1rem;
      font-weight: 700;
      color: #fff;
      padding: .95rem 1.4rem;
      border-radius: 16px;
      background: var(--grad-brand);
      box-shadow: 0 14px 32px -12px rgba(10,95,255,.55);
      transition: transform .25s ease, box-shadow .25s ease, filter .25s ease;
    }
    .lt-contact:hover {
      transform: translateY(-3px);
      box-shadow: 0 20px 42px -12px rgba(10,95,255,.6);
      filter: brightness(1.04);
    }
    .lt-contact:active { transform: translateY(-1px); }
    .lt-contact svg { width: 18px; height: 18px; }

    .lt-foot {
      margin-top: 1.6rem;
      font-size: .76rem;
      color: var(--muted);
    }
    .lt-foot span { color: var(--accent); font-weight: 600; }

    @media (max-width: 420px) {
      .lt-card { padding: 2.1rem 1.4rem 1.8rem; }
      .lt-social { width: 56px; height: 56px; }
    }
  </style>
</head>
